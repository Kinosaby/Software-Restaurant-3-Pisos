name: Generar APK Android

on:
  push:
    branches: [app-android]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL HTTPS del backend en Railway
        required: false
        default: https://software-restaurant-3-pisos-production.up.railway.app
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tres_pisos_app

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'https://software-restaurant-3-pisos-production.up.railway.app' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tres-pisos-android
          path: tres_pisos_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
