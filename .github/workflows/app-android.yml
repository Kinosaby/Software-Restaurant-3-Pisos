name: App Android

on:
  push:
    branches: [main]
    paths: ['tres_pisos_app/**', '.github/workflows/app-android.yml']
  pull_request:
    paths: ['tres_pisos_app/**', '.github/workflows/app-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tres_pisos_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get
      - name: Analizar código
        run: flutter analyze
      - name: Ejecutar pruebas
        run: flutter test

      # Los PR (incluidos los de forks) no reciben secretos: solo se valida.
      - name: Preparar firma permanente
        id: firma
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Sin el secreto ANDROID_KEYSTORE_BASE64 el APK se firma con una clave de debug temporal."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/3-pisos-release.jks"
          echo "ruta=$RUNNER_TEMP/3-pisos-release.jks" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        if: github.event_name != 'pull_request'
        env:
          POS_KEYSTORE_PATH: ${{ steps.firma.outputs.ruta }}
          POS_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          POS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: tres-pisos-apk
          path: tres_pisos_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Borrar copia temporal de la firma
        if: always()
        run: rm -f "$RUNNER_TEMP/3-pisos-release.jks"
