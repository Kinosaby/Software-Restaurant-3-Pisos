name: tres_pisos_app
description: Sistema POS Restaurante 3 Pisos
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Fonts & UI
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0

  # Utils
  intl: ^0.19.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  cryptography: ^2.7.0
  wakelock_plus: ^1.3.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pos/
    - assets/pos/js/
    - assets/pos/css/
    - assets/pos/assets/
    - assets/pos/fonts/
    - assets/pos/vendor/
    - assets/pos/vendor/fontawesome/css/
    - assets/pos/vendor/fontawesome/webfonts/
