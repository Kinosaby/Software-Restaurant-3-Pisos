<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Restaurante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div id="icon-lock" style="color: var(--primary); margin-bottom: 15px;"></div>
            <h1 style="font-size: 2.5rem; color: var(--primary);">Restaurante 3 Pisos</h1>
            <p style="color: var(--text-secondary); font-size: 1rem;">Bienvenido a la familia</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Nombre de usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Ingresar
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="/js/icons.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Renderizar icono de bloqueo
            document.getElementById('icon-lock').innerHTML = window.icons.lock;

            const loginForm = document.getElementById('login-form');
            const btnLogin = document.getElementById('btn-login');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    btnLogin.disabled = true;
                    btnLogin.textContent = 'Verificando...';

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Error al iniciar sesión');
                    }

                    // Guardar sesión
                    window.auth.saveSession(data.token, data.user);
                    
                    window.ui.showToast('Bienvenido, ' + data.user.username);
                    
                    // Redirigir según rol
                    setTimeout(() => {
                        window.location.href = '/pages/index.html';
                    }, 1000);

                } catch (error) {
                    window.ui.showToast(error.message, 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Ingresar';
                }
            });
        });
    </script>
</body>
</html>
